name: Build Mr RB Predictions APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project structure
        working-directory: FootballPredictorV4
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mrrb/predictions/MainActivity.java
          test -f app/src/main/assets/index.html
          echo "Project structure OK"
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: FootballPredictorV4
        run: |
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: FootballPredictorV4
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-RB-Predictions-debug-apk
          path: FootballPredictorV4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
