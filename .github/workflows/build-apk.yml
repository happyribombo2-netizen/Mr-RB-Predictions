name: Build Mr RB Predictions Advanced V5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          set -e
          echo "Files in repository:"
          ls -lah
          echo ""
          echo "Checking project ZIP..."

          if [ ! -f "Mr_RB_Predictions_Advanced_V5_1.zip" ]; then
            echo "ERROR: Mr_RB_Predictions_Advanced_V5_1.zip was not found."
            exit 1
          fi

          echo "ZIP found successfully."
          ls -lh Mr_RB_Predictions_Advanced_V5_1.zip

      - name: Extract V5 project
        run: |
          set -e

          rm -rf extracted

          unzip -o Mr_RB_Predictions_Advanced_V5_1.zip -d extracted

          echo ""
          echo "ZIP contents:"
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR=$(find extracted \
            -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Extracted files:"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 5 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Show Java and Gradle versions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "===== settings.gradle ====="
          cat settings.gradle

          echo ""
          echo "===== build.gradle ====="
          cat build.gradle

          echo ""
          echo "===== app/build.gradle ====="
          cat app/build.gradle

          echo ""
          echo "===== Android Manifest ====="
          cat app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "========================================"
          echo "STARTING ANDROID APK BUILD"
          echo "========================================"

          gradle clean assembleDebug \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Show useful build errors
        if: failure()
        run: |
          echo ""
          echo "========================================"
          echo "BUILD FAILED - IMPORTANT ERROR DETAILS"
          echo "========================================"

          if [ -f "$GITHUB_WORKSPACE/gradle-build.log" ]; then

            echo ""
            echo "===== ERROR LINES ====="

            grep -n -E \
              "FAILURE:|What went wrong:|Execution failed|Could not|error:|ERROR|AAPT|Manifest merger|resource .* not found|Compilation failed|Task .* FAILED" \
              "$GITHUB_WORKSPACE/gradle-build.log" \
              | tail -n 100 || true

            echo ""
            echo "===== LAST 150 LINES ====="

            tail -n 150 "$GITHUB_WORKSPACE/gradle-build.log"

          else
            echo "gradle-build.log was not created."
          fi

      - name: Find APK
        if: success()
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 
