name: Build Mr RB Predictions APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find the uploaded ZIP and extract it
      - name: Extract Mr RB project
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/project"

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP package found."
            exit 1
          fi

          echo "Using package:"
          echo "$ZIP"

          unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/project"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/project" -maxdepth 6 -type f | sort

      # 3. Automatically locate the Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT=""

          SETTINGS=$(find "$GITHUB_WORKSPACE/project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle was not found."
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      # 4. Check required Android files
      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" \
            || test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project verification PASSED."

      # 5. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 6. Install Gradle 8.7
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 7. Check important Mr RB features
      - name: Verify Mr RB features
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking market requirements..."

          grep -qi "1-5" "$HTML"
          grep -qi "1-10" "$HTML"
          grep -qi "1-15" "$HTML"

          echo "Minute Draw markets found."

          if grep -qi "Connect the secure Mr RB Sports API first" "$HTML"; then
            echo "ERROR: Old API-key blocking message still exists."
            exit 1
          fi

          echo "Old API-key blocking message NOT found."

      # 8. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      # 9. Locate the finished APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Mr-RB-Predictions.apk"

      # 10. Upload APK for download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-RB-Predictions-APK
          path: output/Mr-RB-Predictions.apk
          if-no-files-found: error
          retention-days: 7

      # 11. Build summary
      - name: Build summary
        shell: bash
        run: |
          echo "======================================"
          echo "MR RB PREDICTIONS BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: Mr-RB-Predictions.apk"
          echo "Minute Draw markets: VERIFIED"
          echo "API-key blocking screen: VERIFIED REMOVED"
          echo "======================================"
