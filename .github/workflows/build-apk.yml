name: Build Mr RB Predictions Advanced V5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract V5 project ZIP
        run: |
          set -e

          unzip -o Mr_RB_Predictions_Advanced_V5_1.zip -d extracted

          echo "ZIP extracted successfully."

      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          mkdir -p final-apk

          cp "$APK" final-apk/Mr-RB-Predictions-Advanced-V5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-RB-Predictions-Advanced-V5-APK
          path: final-apk/Mr-RB-Predictions-Advanced-V5.apk
          if-no-files-found: error
          retention-days: 7
