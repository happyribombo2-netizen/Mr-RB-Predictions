name: Build Mr RB Predictions APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/work"

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f -iname "*.zip" \
            ! -path "*/.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          unzip -oq "$ZIP_FILE" -d "$GITHUB_WORKSPACE/work"

          echo "Extracted project:"
          find "$GITHUB_WORKSPACE/work" -maxdepth 6 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/work" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android files
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/index.html" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          echo "Android project verification PASSED."

      - name: Verify Mr RB features
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking application..."

          if grep -qi "Connect the secure Mr RB Sports API first" "$HTML"; then
            echo "ERROR: Old API blocking check still exists."
            exit 1
          fi

          echo "Old API blocking check: REMOVED"

          echo "Checking minute-draw markets..."

          grep -qi "1-5" "$HTML"
          grep -qi "1-10" "$HTML"
          grep -qi "1-15" "$HTML"

          echo "1-5 Draw: FOUND"
          echo "1-10 Draw: FOUND"
          echo "1-15 Draw: FOUND"

      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          HTML="$PROJECT_DIR/app/src/main/assets/index.html"

          python3 - "$HTML" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()

          scripts = re.findall(
              r"<script[^>]*>(.*?)</script>",
              text,
              re.S | re.I
          )

          if not scripts:
              print("No inline JavaScript found.")
              sys.exit(0)

          for i, script in enumerate(scripts, 1):
              open(f"/tmp/mrrb_script_{i}.js", "w",
                   encoding="utf-8").write(script)

          print(f"Found {len(scripts)} JavaScript blocks.")
          PY

          for JS in /tmp/mrrb_script_*.js; do
            node --check "$JS"
          done

          echo "JavaScript syntax PASSED."

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Mr-RB-Predictions.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-RB-Predictions-APK
          path: output/Mr-RB-Predictions.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build complete
        run: |
          echo "======================================"
          echo "MR RB PREDICTIONS APK BUILD COMPLETE"
          echo "======================================"
