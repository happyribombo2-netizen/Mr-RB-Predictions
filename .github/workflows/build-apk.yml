name: Build Mr RB Predictions APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx2g
    -Dfile.encoding=UTF-8

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          # First check whether the project is already extracted
          SETTINGS=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1 || true)

          # If no Android project was found, search for a ZIP
          if [ -z "$SETTINGS" ]; then

            ZIP=$(find . -type f -name "*.zip" | head -n 1 || true)

            if [ -z "$ZIP" ]; then
              echo "::error::No Android project and no ZIP file were found."
              echo "Files in repository:"
              find . -maxdepth 5 -type f | sort
              exit 1
            fi

            echo "Found ZIP:"
            echo "$ZIP"

            mkdir -p _mr_rb_project

            unzip -o "$ZIP" -d _mr_rb_project

            SETTINGS=$(find _mr_rb_project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1 || true)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::Could not find settings.gradle after extracting the project."
            echo "Extracted files:"
            find . -maxdepth 7 -type f | sort
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT"

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "::error::Android app module was not found."
            find "$PROJECT" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "PROJECT_PATH=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "Checking:"
          echo "$PROJECT_PATH"

          test -f "$PROJECT_PATH/settings.gradle" || \
          test -f "$PROJECT_PATH/settings.gradle.kts"

          test -f "$PROJECT_PATH/app/build.gradle" || \
          test -f "$PROJECT_PATH/app/build.gradle.kts"

          test -f "$PROJECT_PATH/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_PATH/app/src/main/java/com/mrrb/predictions/MainActivity.java"

          test -f "$PROJECT_PATH/app/src/main/assets/index.html"

          echo "All required Android files found."

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -e

          echo "Starting Mr RB Predictions APK build..."

          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              clean assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              clean assembleDebug
          fi

          echo "APK build completed."

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_PATH/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            find "$PROJECT_PATH/app/build" -type f | sort || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-RB-Predictions-V10-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
