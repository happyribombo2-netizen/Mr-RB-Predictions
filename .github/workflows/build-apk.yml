name: Build Mr RB Predictions APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mr-rb-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx2g
    -Dfile.encoding=UTF-8

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository
        shell: bash
        run: |
          set -e
          echo "Repository contents:"
          find . -maxdepth 4 -type f | sort | head -n 300

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "FootballPredictorV4/settings.gradle" ] && \
             [ -f "FootballPredictorV4/app/build.gradle" ]; then
            echo "path=FootballPredictorV4" >> "$GITHUB_OUTPUT"

          elif [ -f "settings.gradle" ] && \
               [ -f "app/build.gradle" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"

          else
            SETTINGS=$(find . -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "::error::Could not find an Android Gradle project."
              exit 1
            fi

            PROJECT=$(dirname "$SETTINGS")

            if [ ! -f "$PROJECT/app/build.gradle" ] && \
               [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
              echo "::error::Android app module was not found."
              exit 1
            fi

            echo "path=$PROJECT" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Android project
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -e

          test -f settings.gradle || \
          test -f settings.gradle.kts

          test -f app/build.gradle || \
          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/mrrb/predictions/MainActivity.java
          test -f app/src/main/assets/index.html

          echo "Android project files OK."

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              clean assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              clean assembleDebug
          fi

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi

          echo "APK successfully created:"
          echo "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-RB-Predictions-V10-APK
          path: |
            ${{ steps.project.outputs.path }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
