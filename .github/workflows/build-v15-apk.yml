name: Build Mr RB Predictions V15

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V15 ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for V15 ZIP..."

          ZIP=$(find . \
            -type f \
            -not -path './.git/*' \
            -name 'Mr_RB_Predictions_V15*.zip' \
            -print | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V15 ZIP not found."
            echo ""
            echo "ZIP files in repository:"
            find . \
              -type f \
              -not -path './.git/*' \
              -iname '*.zip' \
              -print
            exit 1
          fi

          echo "Found:"
          echo "$ZIP"

          echo "$ZIP" > v15_zip.txt

      - name: Extract V15 project
        shell: bash
        run: |
          set -e

          ZIP=$(cat v15_zip.txt)

          rm -rf v15_source
          mkdir -p v15_source

          unzip -q "$ZIP" -d v15_source

          echo "V15 extracted."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find v15_source \
            -type f \
            \( \
              -name 'settings.gradle' \
              -o \
              -name 'settings.gradle.kts' \
            \) \
            -print | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find v15_source -maxdepth 6 -type f | head -300
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          cd "$PROJECT_DIR"

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app build.gradle not found."
            exit 1
          fi

          echo "Android project structure OK."

      - name: Verify Mr RB branding and redesign
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print | head -n 1)

          if [ -z "$HTML" ]; then
            echo "ERROR: HTML interface not found."
            exit 1
          fi

          grep -qi "Mr RB Predictions" "$HTML"
          grep -qi "Prediction" "$HTML"
          grep -qi "Markets" "$HTML"

          echo "Branding and redesign verified."

      - name: Verify sports
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print | head -n 1)

          grep -qi "Football" "$HTML"
          grep -qi "Rugby" "$HTML"
          grep -qi "Tennis" "$HTML"
          grep -qi "Golf" "$HTML"
          grep -qi "Basketball" "$HTML"
          grep -qi "Cricket" "$HTML"

          echo "Sports verification passed."

      - name: Verify markets
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print | head -n 1)

          grep -Eq '1[-–—]5' "$HTML"
          grep -Eq '1[-–—]10' "$HTML"
          grep -Eq '1[-–—]15' "$HTML"

          grep -qi "1X2" "$HTML"
          grep -qi "Double Chance" "$HTML"
          grep -qi "Draw No Bet" "$HTML"
          grep -qi "Handicap" "$HTML"
          grep -qi "Over" "$HTML"
          grep -qi "BTTS" "$HTML"
          grep -qi "Correct Score" "$HTML"
          grep -Eqi "Half[- ]time|HalfTime|halfTime" "$HTML"
          grep -Eqi "Second[- ]half|SecondHalf|secondHalf" "$HTML"
          grep -qi "Corners" "$HTML"
          grep -qi "Cards" "$HTML"

          echo "Market verification passed."

      - name: Verify no old API key blocker
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print | head -n 1)

          if grep -qiE \
            "Save your API key|Enter API key|Connect the secure Mr RB Sports API first" \
            "$HTML"; then
            echo "ERROR: Old API key blocker detected."
            exit 1
          fi

          echo "API key blocker check passed."

      - name: Verify touch handling
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print | head -n 1)

          grep -qi "touchend" "$HTML"

          echo "Touch handling verified."

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print | head -n 1)

          python3 - "$HTML" <<'PY'
          import re
          import subprocess
          import sys

          html_path = sys.argv[1]

          with open(html_path, "r", encoding="utf-8") as f:
              html = f.read()

          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              flags=re.I | re.S
          )

          if not scripts:
              raise SystemExit("No JavaScript found.")

          checked = 0

          for number, script in enumerate(scripts, 1):
              if not script.strip():
                  continue

              result = subprocess.run(
                  ["node", "--check"],
                  input=script,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  print(result.stderr)
                  raise SystemExit(
                      f"JavaScript syntax error in script {number}"
                  )

              checked += 1

          print(
              f"JavaScript syntax check passed: {checked} scripts."
          )
          PY

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          echo "Starting Android build..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            find app/build -type f | head -200
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Mr_RB_Predictions_V15.apk"

          echo "APK successfully created:"
          ls -lh \
            "$GITHUB_WORKSPACE/release/Mr_RB_Predictions_V15.apk"

      - name: Upload V15 APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-RB-Predictions-V15-APK
          path: release/Mr_RB_Predictions_V15.apk
          if-no-files-found: error
          retention-days: 30
