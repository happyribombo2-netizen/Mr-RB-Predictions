name: Build Mr RB Predictions V15

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V15 ZIP
        run: |
          set -e

          ZIP=$(find . \
            -type f \
            -not -path './.git/*' \
            -iname 'Mr_RB_Predictions_V15*.zip' \
            -print \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V15 ZIP not found."
            echo "ZIP files found:"
            find . -type f -not -path './.git/*' -iname '*.zip'
            exit 1
          fi

          echo "Found V15 ZIP:"
          echo "$ZIP"

          printf '%s\n' "$ZIP" > v15_zip.txt

      - name: Extract V15 project
        run: |
          set -e

          ZIP=$(cat v15_zip.txt)

          rm -rf v15_source
          mkdir -p v15_source

          unzip -q "$ZIP" -d v15_source

          echo "V15 project extracted."

      - name: Locate Android project
        run: |
          set -e

          SETTINGS=$(find v15_source \
            -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          printf '%s\n' "$PROJECT_DIR" > project_dir.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          test -f app/src/main/AndroidManifest.xml

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "ERROR: app build file not found."
            exit 1
          fi

          echo "Android project verification passed."

      - name: Verify Mr RB interface
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print \
            | head -n 1)

          if [ -z "$HTML" ]; then
            echo "ERROR: HTML interface not found."
            exit 1
          fi

          grep -qi "Mr RB Predictions" "$HTML"
          grep -qi "Prediction" "$HTML"
          grep -qi "Markets" "$HTML"

          echo "Mr RB interface verified."

      - name: Verify sports
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print \
            | head -n 1)

          for SPORT in Football Rugby Tennis Golf Basketball Cricket; do
            if ! grep -qi "$SPORT" "$HTML"; then
              echo "ERROR: Sport missing: $SPORT"
              exit 1
            fi
          done

          echo "Sports verification passed."

      - name: Verify markets
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print \
            | head -n 1)

          grep -Eq '1[-–—]5' "$HTML"
          grep -Eq '1[-–—]10' "$HTML"
          grep -Eq '1[-–—]15' "$HTML"

          grep -qi "1X2" "$HTML"
          grep -qi "Double Chance" "$HTML"
          grep -qi "Draw No Bet" "$HTML"
          grep -qi "Handicap" "$HTML"
          grep -qi "Over" "$HTML"
          grep -qi "BTTS" "$HTML"
          grep -qi "Correct Score" "$HTML"
          grep -Eqi "Half[- ]time|HalfTime|halfTime" "$HTML"
          grep -Eqi "Second[- ]half|SecondHalf|secondHalf" "$HTML"
          grep -qi "Corners" "$HTML"
          grep -qi "Cards" "$HTML"

          echo "Market verification passed."

      - name: Verify touch controls
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print \
            | head -n 1)

          grep -qi "touchend" "$HTML"

          echo "Touch controls verified."

      - name: Check JavaScript
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          HTML=$(find app/src/main/assets \
            -type f \
            -name '*.html' \
            -print \
            | head -n 1)

          python3 - "$HTML" <<'PY'
          import re
          import subprocess
          import sys

          html_file = sys.argv[1]

          with open(html_file, "r", encoding="utf-8") as f:
              html = f.read()

          scripts = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              flags=re.I | re.S
          )

          if not scripts:
              raise SystemExit("No JavaScript found.")

          count = 0

          for number, script in enumerate(scripts, 1):
              if not script.strip():
                  continue

              result = subprocess.run(
                  ["node", "--check"],
                  input=script,
                  text=True,
                  capture_output=True
              )

              if result.returncode != 0:
                  print(result.stderr)
                  raise SystemExit(
                      f"JavaScript error in script {number}"
                  )

              count += 1

          print(f"JavaScript check passed: {count} scripts.")
          PY

      - name: Build APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          echo "Building Mr RB Predictions V15..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Mr_RB_Predictions_V15.apk"

          echo "APK created successfully:"
          ls -lh "$GITHUB_WORKSPACE/release/Mr_RB_Predictions_V15.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mr-RB-Predictions-V15-APK
          path: release/Mr_RB_Predictions_V15.apk
          if-no-files-found: error
          retention-days: 30
