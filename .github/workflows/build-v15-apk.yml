name: Build Mr RB Predictions V15

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find ANY V15 ZIP
      - name: Find V15 ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "Searching for Mr RB Predictions V15 ZIP..."

          ZIP=$(find . \
            -type f \
            -not -path './.git/*' \
            \
              -name 'Mr_RB_Predictions_V15*.zip' \
              -o -name 'Mr-RB-Predictions-V15*.zip' \
            \
            -print | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No V15 ZIP was found."
            echo ""
            echo "ZIP files found in repository:"
            find . \
              -type f \
              -not -path './.git/*' \
              -iname '*.zip' \
              -print
            exit 1
          fi

          echo "V15 ZIP found:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # 3. Extract the V15 project
      - name: Extract V15 project
        shell: bash
        run: |
          set -e

          rm -rf v15_source
          mkdir -p v15_source

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d v15_source

          echo "V15 project extracted."

          find v15_source -maxdepth 5 -type f | head -200

      # 4. Find the Android project automatically
      - name: Locate Android project
        id: android_project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find v15_source \
            -type f \
            \
              -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
            \
            -print | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android settings.gradle was not found."

            echo ""
            echo "Project files:"
            find v15_source -maxdepth 6 -type f | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 5. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 6. Install Gradle 8.7
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 7. Verify Android project
      - name: Verify Mr RB project
        working-directory: ${{ steps.android
