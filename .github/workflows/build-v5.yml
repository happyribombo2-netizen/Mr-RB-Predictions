name: Build Mr RB Predictions V5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        run: |
          set -e

          echo "Checking for project ZIP..."

          test -f "Mr_RB_Predictions_Advanced_V5_1.zip"

          echo "ZIP found:"
          ls -lh "Mr_RB_Predictions_Advanced_V5_1.zip"

      - name: Extract project
        run: |
          set -e

          rm -rf project

          mkdir project

          unzip -q "Mr_RB_Predictions_Advanced_V5_1.zip" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | sort

      - name: Set project directory
        run: |
          set -e

          if [ -f "project/FootballPredictorV4/settings.gradle" ]; then
            echo "PROJECT_DIR=project/FootballPredictorV4" >> "$GITHUB_ENV"
            echo "Found Android project."

          elif [ -f "project/settings.gradle" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            echo "Found Android project."

          else
            echo "Android project not found."
            find project -name settings.gradle -o -name settings.gradle.kts
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check environment
        run: |
          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail

          echo "===================================="
          echo "BUILDING MR RB PREDICTIONS V5"
          echo "===================================="

          gradle clean assembleDebug --stacktrace --info 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show build failure
        if: failure()
        run: |
          echo "===================================="
          echo "BUILD FAILED"
          echo "===================================="

          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            echo ""
            echo "IMPORTANT ERRORS:"
            grep -n -E "FAILURE:|What went wrong:|Execution failed|Could not|error:|ERROR|AAPT|Manifest merger|resource .* not found|Task .* FAILED" build.log | tail -100 || true

            echo ""
            echo "LAST 150 LINES:"
            tail -150 build.log
          fi

      - name: Locate APK
        if: success()
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | grep "/build/outputs/" | head -1)

          if [ -z "$APK" ]; then
            echo "APK was not found."
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          mkdir -p final-apk

          cp "$APK" "final-apk/Mr-RB-Predictions-V5.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mr-RB-Predictions-V5-APK
          path: final-apk/Mr-RB-Predictions-V5.apk
          if-no-files-found: error
          retention-days: 7
